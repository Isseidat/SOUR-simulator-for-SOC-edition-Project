services:
  mongo:
    image: mongo:7.0
    container_name: soar_mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=soar_db
    volumes:
      - mongo_data:/data/db
    networks:
      - soar-network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: soar_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_DISABLE_UI_SECURITY=true
      - N8N_SECURE_COOKIE=false
      - N8N_PREVIEW_MODE=true
      - N8N_COMMUNITY_PACKAGES_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - soar-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soar_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: npm run dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/soar_db
      - N8N_LOCAL_URL=http://n8n:5678
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-mock_soar_secret_123}
      - N8N_API_KEY=${N8N_API_KEY}
      - N8N_MASTER_WORKFLOW_ID=${N8N_MASTER_WORKFLOW_ID}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - MANAGER_EMAIL=${MANAGER_EMAIL}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - CC_EMAIL=${CC_EMAIL}
    depends_on:
      - mongo
      - n8n
    networks:
      - soar-network

volumes:
  mongo_data:
  n8n_data:
    external: true

networks:
  soar-network:
    driver: bridge
