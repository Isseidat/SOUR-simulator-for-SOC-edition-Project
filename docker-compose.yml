services:
  mongo:
    image: mongo:7.0
    container_name: soar_mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=soar_db
    volumes:
      - mongo_data:/data/db
    networks:
      - soar-network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: soar_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_DISABLE_UI_SECURITY=true
      - N8N_SECURE_COOKIE=false
      - N8N_PREVIEW_MODE=true
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - soar-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soar_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: npm run dev
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/soar_db
      - WEBHOOK_SECRET=mock_soar_secret_123
      - N8N_LOCAL_URL=http://n8n:5678
      - MANAGER_EMAIL=dat.tanvo6767@gmail.com
      - EMAIL_USER=${EMAIL_USER:-dat.tanvo6767@gmail.com}
      - EMAIL_PASS=${EMAIL_PASS:-nblzvdbfzxvvddny}
      - CC_EMAIL=${CC_EMAIL:-perosz4153@gmail.com}
    depends_on:
      - mongo
      - n8n
    networks:
      - soar-network

volumes:
  mongo_data:
  n8n_data:
    external: true

networks:
  soar-network:
    driver: bridge
